    {% load django_bootstrap5 %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Locadora{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Locadora</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'carros:lista' %}">Carros</a>
                <a class="nav-link" href="{% url 'clientes:lista' %}">Clientes</a>
                <a class="nav-link" href="{% url 'locacoes:lista' %}">Locações</a>
                <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
            </div>
        </div>
    </nav>
    <main class="container">
         {% block conteudo %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></
script>
</body>
</html>
